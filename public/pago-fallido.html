<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pago no completado — Mineouse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #17151F; color: #EDEAE3; font-family: 'Inter', sans-serif; padding: 24px;
  }
  .card { max-width: 420px; text-align: center; }
  .badge {
    width: 64px; height: 64px; border-radius: 999px; background: #F0483E; color: #111;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 28px;
  }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.6; margin: 0 0 16px; }
  p { color: rgba(237,234,227,0.7); line-height: 1.6; margin: 0 0 8px; font-size: 14px; }
  .order { font-family: monospace; color: #EDEAE3; }
  a.btn {
    display: inline-block; margin-top: 28px; padding: 12px 24px; background: #F0483E; color: #111;
    text-decoration: none; border-radius: 6px; font-family: monospace; font-size: 12px; letter-spacing: 0.08em;
  }
  a.link {
    display: block; margin-top: 14px; color: rgba(237,234,227,0.5); font-size: 12px; text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✕</div>
    <h1>El pago no se pudo completar</h1>
    <p>Tu pedido <span class="order" id="pedido"></span> no fue confirmado — no se te realizó ningún cobro.</p>
    <p>Puede haber sido un rechazo del banco, datos incorrectos, o que cancelaste el pago a mitad de camino.</p>
    <a class="btn" href="/">VOLVER A INTENTAR</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pedido = params.get("pedido");
    document.getElementById("pedido").textContent = pedido ? `#${pedido}` : "";
  </script>
</body>
</html>
